<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="minBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#08090e"/>
    </linearGradient>

    <!-- Glowing Rim -->
    <linearGradient id="minRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Apple Cyan / Azure Gradient -->
    <linearGradient id="macArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Android Emerald / Cyan Gradient -->
    <linearGradient id="phoneArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Bridge Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Blur & Glow Filters -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="centerAmbient" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Master Squircle Canvas (512x512) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#minBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#centerAmbient)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="url(#minRim)" stroke-width="2"/>

  <!-- 2. Ambient Diffused Glow Behind the Glyph -->
  <g filter="url(#outerGlow)" opacity="0.6">
    <ellipse cx="256" cy="256" rx="130" ry="80" fill="url(#beamGrad)"/>
  </g>

  <!-- 3. The Interlocking Continuity "Bridge" Glyph -->
  <!-- Left Portal (Mac Display Contour Arc) -->
  <g filter="url(#tightGlow)">
    <path d="M 230 148 
             L 164 148 
             A 44 44 0 0 0 120 192 
             L 120 320 
             A 44 44 0 0 0 164 364 
             L 230 364" 
          fill="none" 
          stroke="url(#macArcGrad)" 
          stroke-width="32" 
          stroke-linecap="round"/>
  </g>

  <!-- Right Portal (Android Phone Contour Arc) -->
  <g filter="url(#tightGlow)">
    <path d="M 282 148 
             L 348 148 
             A 44 44 0 0 1 392 192 
             L 392 320 
             A 44 44 0 0 1 348 364 
             L 282 364" 
          fill="none" 
          stroke="url(#phoneArcGrad)" 
          stroke-width="32" 
          stroke-linecap="round"/>
  </g>

  <!-- Central Dynamic Bridge Sync Wave / Infinity Pulse -->
  <g filter="url(#tightGlow)">
    <!-- Bridge Wave Ribbon -->
    <path d="M 180 256 C 220 200, 292 312, 332 256" 
          fill="none" 
          stroke="url(#beamGrad)" 
          stroke-width="16" 
          stroke-linecap="round"/>

    <!-- Bright White Core Energy Arc -->
    <path d="M 196 256 C 226 210, 286 302, 316 256" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-opacity="0.95"/>

    <!-- Focal Sync Node in Center -->
    <circle cx="256" cy="256" r="11" fill="#ffffff"/>
    <circle cx="256" cy="256" r="6" fill="#0071E3"/>
  </g>

  <!-- 4. Subtle Specular Highlight Curve -->
  <path d="M 28 32 C 160 32, 400 48, 484 170 C 420 80, 240 54, 28 54 Z" 
        fill="#ffffff" 
        fill-opacity="0.05"/>
</svg>
