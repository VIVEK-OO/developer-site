<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Minimalist Dark Apple Squircle Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>

    <!-- Subtle Hairline Rim Highlight -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Soft Ambient Knockout Shadow for the Phone -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. Apple Squircle Canvas (512x512) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- 2. Minimalist Mac (Laptop) Outline - Menu Bar / SF Symbol Style -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- MacBook Screen (Lid) -->
    <rect x="84" y="146" width="252" height="156" rx="16" stroke-width="18"/>
    
    <!-- Camera Dot at top of display -->
    <circle cx="210" cy="162" r="3.5" fill="#ffffff" stroke="none"/>

    <!-- MacBook Base (Keyboard Chassis) -->
    <path d="M 52 316 L 368 316 C 374 316, 379 320, 377 326 L 370 338 C 367 344, 361 348, 354 348 L 66 348 C 59 348, 53 344, 50 338 L 43 326 C 41 320, 46 316, 52 316 Z" 
          stroke-width="16" 
          fill="#16161b"/>

    <!-- Display Opening Groove / Trackpad Notch -->
    <line x1="184" y1="316" x2="236" y2="316" stroke="#121216" stroke-width="14"/>
  </g>

  <!-- 3. Minimalist Phone Outline - Floating on Foreground Right -->
  <g filter="url(#phoneShadow)">
    <!-- Phone Chassis (Knockout background to cleanly separate from Mac behind) -->
    <rect x="282" y="172" width="138" height="236" rx="28" fill="#18181e" stroke="#ffffff" stroke-width="18"/>
    
    <!-- Top Speaker Bar / Dynamic Island -->
    <line x1="334" y1="196" x2="368" y2="196" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Bottom Home Gesture Pill -->
    <line x1="332" y1="384" x2="370" y2="384" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
