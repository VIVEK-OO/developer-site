<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bezel Rim Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Bridge Energy Gradients -->
    <linearGradient id="cyanBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#11141c"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Master Squircle Icon Base (Standard Apple / Play Store 512x512 geometry) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#topGlow)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="url(#rimStroke)" stroke-width="2"/>

  <!-- Subtle ambient inner glow ring -->
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- 2. Mac Desktop Display Outline (Left & Centered Backing) -->
  <g filter="url(#shadowFilter)">
    <!-- Mac Screen Frame -->
    <rect x="88" y="104" width="260" height="172" rx="16" fill="#131722" stroke="#2a3245" stroke-width="3"/>
    
    <!-- Mac Display Inner Screen Surface -->
    <rect x="96" y="112" width="244" height="144" rx="10" fill="#0b0d14"/>
    
    <!-- macOS Window Titlebar Traffic Lights -->
    <circle cx="112" cy="125" r="4" fill="#ff5f57"/>
    <circle cx="124" cy="125" r="4" fill="#ffbd2e"/>
    <circle cx="136" cy="125" r="4" fill="#28cd41"/>
    
    <!-- Screen Grid Content Silhouette (Mac Window) -->
    <rect x="110" y="142" width="70" height="6" rx="3" fill="#38bdf8" fill-opacity="0.5"/>
    <rect x="110" y="156" width="130" height="5" rx="2.5" fill="#334155" fill-opacity="0.8"/>
    <rect x="110" y="168" width="110" height="5" rx="2.5" fill="#334155" fill-opacity="0.6"/>

    <!-- Mac Stand & Base -->
    <path d="M198 276 L190 324 L246 324 L238 276 Z" fill="#1a202c" stroke="#2a3245" stroke-width="1.5"/>
    <rect x="174" y="322" width="88" height="6" rx="3" fill="#242c3d" stroke="#38435a" stroke-width="1"/>
  </g>

  <!-- 3. The Glowing Bridge (Infinity / Continuity Wave Linking Mac and Phone) -->
  <g filter="url(#intenseGlow)">
    <!-- Underlying Soft Neon Beam -->
    <path d="M 210 200 C 270 140, 290 280, 360 230" 
          fill="none" 
          stroke="url(#electricGlow)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-opacity="0.25"/>
  </g>

  <g filter="url(#neonGlow)">
    <!-- Primary High-Vibrancy Bridge Arc -->
    <path d="M 200 200 C 265 145, 295 285, 360 230" 
          fill="none" 
          stroke="url(#electricGlow)" 
          stroke-width="7" 
          stroke-linecap="round"/>
    
    <!-- Fast Core Laser Line -->
    <path d="M 200 200 C 265 145, 295 285, 360 230" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-opacity="0.9"/>
  </g>

  <!-- Data Flow Nodes on the Bridge -->
  <g filter="url(#neonGlow)">
    <circle cx="242" cy="178" r="6" fill="#38bdf8"/>
    <circle cx="242" cy="178" r="2.5" fill="#ffffff"/>

    <circle cx="295" cy="242" r="6" fill="#6366f1"/>
    <circle cx="295" cy="242" r="2.5" fill="#ffffff"/>
  </g>

  <!-- 4. Modern Android Phone Outline (Foreground Right with Depth & Drop Shadow) -->
  <g filter="url(#shadowFilter)">
    <!-- Outer Phone Chassis with Metallic Bezel -->
    <rect x="286" y="160" width="138" height="258" rx="26" fill="url(#phoneGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.85"/>
    
    <!-- Phone Screen Glass Face -->
    <rect x="294" y="168" width="122" height="242" rx="20" fill="#090b10"/>
    
    <!-- Camera Pinhole / Dynamic Island -->
    <rect x="343" y="176" width="24" height="6" rx="3" fill="#1e2433"/>
    <circle cx="360" cy="179" r="1.5" fill="#38bdf8" fill-opacity="0.6"/>

    <!-- Screen Content: Active Connection Card -->
    <rect x="306" y="196" width="98" height="56" rx="10" fill="#141926" stroke="#252f44" stroke-width="1"/>
    <rect x="316" y="208" width="46" height="5" rx="2.5" fill="#38bdf8"/>
    <rect x="316" y="219" width="76" height="4" rx="2" fill="#475569"/>
    <rect x="316" y="228" width="62" height="4" rx="2" fill="#334155"/>

    <!-- 2FA / Notification Floating Pill on Phone -->
    <g filter="url(#neonGlow)">
      <rect x="304" y="266" width="102" height="48" rx="12" fill="#0f172a" stroke="url(#cyanBridge)" stroke-width="1.5"/>
      <circle cx="320" cy="290" r="4.5" fill="#22c55e"/>
      <rect x="332" y="282" width="56" height="5" rx="2.5" fill="#f8fafc"/>
      <rect x="332" y="293" width="42" height="4" rx="2" fill="#64748b"/>
    </g>

    <!-- Bottom Home Gesture Pill Indicator -->
    <rect x="338" y="396" width="34" height="3" rx="1.5" fill="#64748b" fill-opacity="0.6"/>
  </g>

  <!-- 5. Optical Specular Shine (Top Glass Curved Reflection) -->
  <path d="M 32 32 C 180 32, 420 50, 480 180 C 420 100, 240 64, 32 64 Z" 
        fill="#ffffff" 
        fill-opacity="0.04"/>
</svg>
